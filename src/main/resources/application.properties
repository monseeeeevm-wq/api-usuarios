spring.application.name=usuarios

# Perfil local
spring.profiles.active=local

# --- Base de datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usuarios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# validate: Hibernate revisa que la tabla coincida con la entidad, pero NO la crea
# (la tabla se crea con script.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html